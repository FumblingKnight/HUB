name = "sajo-atlas"
main = "./worker.mjs"
compatibility_date = "2026-10-11"

[vars]
ATLAS_REPOSITORY = "FumblingKnight/Sajo-Atlas"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# One account-wide, per-location login budget limits password guessing.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "92017011"
[ratelimits.simple]
limit = 8
period = 60
