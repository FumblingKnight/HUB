<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c10"><title>Mira — Private sign in</title>
<link rel="stylesheet" href="/login.css">
</head><body>
<main class="shell">
 <div class="mark" aria-hidden="true">✳</div>
 <div class="eyebrow">MIRA · YOUR PRIVATE SPACE</div>
 <h1>Your world,<br><em>just for you.</em></h1>
 <p>Everything in one calm place. Sign in to discover what matters, revisit your knowledge, and see how your projects are going.</p>
 <form id="login">
  <label for="passphrase">Your private passphrase</label>
  <input id="passphrase" type="password" name="passphrase" autocomplete="current-password" required placeholder="Enter passphrase">
  <button type="submit" id="submit">Enter Mira <span aria-hidden="true">↗</span></button>
  <div id="status" role="status" aria-live="polite"></div>
 </form>
 <small>Private GitHub-backed workspace · Encrypted connection</small>
</main>
<script src="/login.js" defer></script></body></html>
