name: ATLAS validation
on:
  push:
    paths:
      - "atlas/**"
      - ".github/workflows/validate-atlas.yml"
  pull_request:
    paths:
      - "atlas/**"
      - ".github/workflows/validate-atlas.yml"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check atlas/core.mjs
      - run: node --check atlas/cloud/worker.mjs
      - run: node --check atlas/cloud/session.mjs
      - run: node --check atlas/cloud/github-media.mjs
      - run: node --check atlas/cloud/media.mjs
      - run: node --check atlas/site/app.js
      - run: node --check atlas/site/viewer-shell.js
      - run: node --check atlas/site/home.js
      - run: node --check atlas/site/login.js
      - run: node --test atlas/site/viewer-ui.test.mjs
      - run: node --check atlas/site/mira.js
      - run: node --check atlas/site/mira-reader.js
      - run: node --check atlas/site/story.js
      - run: node --check atlas/site/story-model.mjs
      - run: node --test atlas/site/story-model.test.mjs
      - run: node --check atlas/site/context.js
      - run: node --check atlas/site/status.js
      - run: node --check atlas/cloud/mira-status.mjs
      - run: node --check atlas/cloud/mira-health.mjs
      - run: node --check atlas/cloud/mira-work.mjs
      - run: node --test atlas/cloud/mira-work.test.mjs
      - run: node --test atlas/cloud/mira-health.test.mjs
      - run: node --test atlas/cloud/mira-status.test.mjs
      - run: node --check atlas/cloud/mira-signals.mjs
      - run: node --check atlas/cloud/mira-newspaper.mjs
      - run: python3 -m py_compile atlas/mira-agent-lab/cloud-news/run.py atlas/mira-agent-lab/cloud-news/auth_blob.py
      - run: printf '{"sources":[]}\n' > /tmp/mira-smoke-registry.json && python3 atlas/mira-agent-lab/cloud-news/run.py --mode smoke --private-root . --registry /tmp/mira-smoke-registry.json
      - run: python3 -m unittest atlas/mira-agent-lab/cloud-news/test_run.py
      - run: node --check atlas/site/newspaper.js
      - run: node --test atlas/cloud/mira-newspaper.test.mjs
      - run: node --check atlas/cloud/mira-discovery.mjs
      - run: node --test atlas/cloud/mira-discovery.test.mjs
      - run: node --check atlas/site/discovery.js
      - run: node --check atlas/retrieve-context.mjs
      - run: node --test atlas/retrieve-context.test.mjs
      - run: node --test atlas/cloud/mira-context.test.mjs
      - run: node --test atlas/cloud/mira-signals.test.mjs
      - run: node --test atlas/core.test.mjs atlas/cloud/media.test.mjs atlas/cloud/session.test.mjs atlas/cloud/github-media.test.mjs
