name: Deploy JARVIS cloud Worker
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare credentials configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo "Add CLOUDFLARE_API_TOKEN GitHub Action secret" && exit 1)
          test -n "$CF_ACCOUNT" || (echo "Add CLOUDFLARE_ACCOUNT_ID GitHub Action secret" && exit 1)
      - name: Deploy separate Worker
        run: npx --yes wrangler@4 deploy --config jarvis/cloud/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
