name: Validate JARVIS cloud lab
on:
  pull_request:
    paths:
      - "jarvis/**"
      - "public/jarvis/**"
      - "package.json"
      - ".github/workflows/validate-jarvis.yml"
  push:
    paths:
      - "jarvis/**"
      - "public/jarvis/**"
      - "package.json"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test private MCP and neural inference
        run: npm run jarvis:test
      - name: Training script syntax
        run: python -m py_compile jarvis/train.py
